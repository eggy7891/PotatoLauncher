name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PotatoLauncher.slnx -c Release
      - name: Test
        run: dotnet run --project tests/PotatoLauncher.Tests/PotatoLauncher.Tests.csproj -c Release --no-build
      - name: Smoke test core
        shell: pwsh
        run: ./scripts/in-memory-smoke.ps1
      - name: Publish
        run: >
          dotnet publish src/PotatoLauncher.App/PotatoLauncher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish
      - name: Upload portable launcher
        uses: actions/upload-artifact@v4
        with:
          name: potato-launcher-unsigned
          path: artifacts/publish/
          if-no-files-found: error
